# Builds Kitaab-<version>-arm64.dmg.
#
# - Push a tag like v0.1.0: the DMG is built with that version and attached to
#   a GitHub release for the tag.
# - Run it by hand (Actions → Build DMG → Run workflow): the DMG is uploaded as
#   a workflow artifact only.
#
# Every DMG gets a SHA256SUMS file signed with Kitaab's release key (secret
# RELEASE_SIGNING_KEY; the public half is release-key.pub). install.sh and the
# app's updater refuse anything that doesn't verify, so a tagged release fails
# without that secret. Installed apps pick up a new tag within about half an hour.
#
# The app is signed with Kitaab's own self-signed certificate (secrets KITAAB_SIGNING_P12,
# base64 of the .p12, and KITAAB_SIGNING_PASSWORD). It isn't trusted by Apple, but it is
# the same certificate every release, so macOS sees each update as the same app and an
# "Always Allow" on the "Kitaab Safe Storage" keychain prompt keeps working. Ad-hoc signing
# (the fallback without those secrets) changes the app's identity on every build, so the
# keychain asks again after each update.
#
# Apple signing and notarization are optional and win when set. Without them, people who
# download the DMG in a browser must allow it in System Settings → Privacy & Security the
# first time they open it.
#   APPLE_CERTIFICATE_P12       base64 of a "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_ID                    Apple ID email, for notarization
#   APPLE_APP_SPECIFIC_PASSWORD app-specific password for that Apple ID
#   APPLE_TEAM_ID               10-character team ID
name: Build DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-latest # Apple silicon, so the DMG is arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes list commits since the previous tag

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KITAAB_SIGNING_P12: ${{ secrets.KITAAB_SIGNING_P12 }}
          KITAAB_SIGNING_PASSWORD: ${{ secrets.KITAAB_SIGNING_PASSWORD }}
        run: |
          # Developer ID when there is one, else Kitaab's self-signed certificate.
          if [ -n "$APPLE_CERTIFICATE_P12" ]; then
            P12="$APPLE_CERTIFICATE_P12"; P12_PASSWORD="$APPLE_CERTIFICATE_PASSWORD"; NAME="Developer ID Application"
          elif [ -n "$KITAAB_SIGNING_P12" ]; then
            P12="$KITAAB_SIGNING_P12"; P12_PASSWORD="$KITAAB_SIGNING_PASSWORD"; NAME="Kitaab Release Signing"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::warning::No signing certificate; the app will be ad-hoc signed and the keychain will ask again after this update."
            fi
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # Not -v: a self-signed certificate is never "valid" (trusted), but codesign signs with it.
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk -v name="$NAME" 'index($0, name) { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No \"$NAME\" signing identity in the certificate secret"
            exit 1
          fi
          echo "Signing as $NAME ($IDENTITY)"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm dmg

      - name: Write and sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::RELEASE_SIGNING_KEY is not set; install.sh can't verify an unsigned release."
              exit 1
            fi
            echo "::warning::RELEASE_SIGNING_KEY is not set; writing an unsigned SHA256SUMS."
            (cd dist && shasum -a 256 Kitaab-*.dmg > SHA256SUMS && cat SHA256SUMS)
            exit 0
          fi
          scripts/sign-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: kitaab-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "What's new" is what the app's update card shows; it hides the Install and
          # SHA-256 sections below. Commit subjects since the previous tag, newest first.
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          {
            echo "## What's new"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..$GITHUB_REF_NAME"
              echo
              echo "[All changes since $prev](https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME)"
            else
              echo "The first release."
            fi
            echo
            echo '## Install'
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | bash"
            echo '```'
            echo
            echo 'The installer checks the signature and checksum below before installing. To check a manual download, see [Verifying a download](https://github.com/'"$GITHUB_REPOSITORY"'#verifying-a-download).'
            echo
            echo '## SHA-256'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Kitaab $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS dist/SHA256SUMS.sig --clobber
